# 数据源分工（2026-11-04 更新）
# primary：API-Football v3 —— 赛程、伤停、首发、交锋、最终比分（结算）、多公司亚盘(参考)
# titan007：亚盘初盘/即时盘/水位的主数据源（推荐用的盘口以此为准），同时是赛程/比分备用源
roles:
  fixtures:    [api_football, titan007_live_fixtures]
  final_scores: [api_football, football_data, titan007_live_fixtures]  # 欧洲比赛 football_data 交叉核对
  injuries:    [api_football, websearch_previews]
  lineups:     [api_football, websearch_previews]
  h2h:         [api_football, websearch_previews]
  form:        [api_football_local_history, football_data, websearch_previews]  # 免费档拿不到当季 standings/teams statistics
  standings:   [football_data, titan007_live_fixtures, websearch_previews]       # bfdata 带排名
  asian_handicap_line: [titan007_odds, api_football_odds, the_odds_api, oddspapi, fivedollar]  # 多公司盘口交叉核对：api_football 优先，其次 the_odds_api，titan007 备用
api_football:
  base_url: "https://v3.football.api-sports.io"
  auth: "header x-apisports-key，值取环境变量 API_FOOTBALL_KEY（CI: Secret API_FOOTBALL_KEY）；绝不写入仓库"
  plan: Free            # 100 次/天（UTC 0 点重置），约 10 次/分钟；/status 不计数
  reserve: 10           # 剩余 <= 10 时客户端拒绝非结算请求
  league_ids: config/leagues.yaml（apif 字段），原始结果缓存 data/cache/leagues.json
  cache_ttl: {fixtures: 6h, h2h: 7d, standings: 12h, injuries: 3h, lineups: "空不缓存/有则永久", result: "完场后永久", odds: 30m}
  free_plan_tested_2026-11-04:
    works:
      - "GET /status, /leagues"
      - "GET /fixtures?date=YYYY-MM-DD （当天全部比赛，一次请求，含当季赛事）"
      - "GET /fixtures?id=<id> （比分/状态，用于结算）"
      - "GET /injuries?fixture=<id> （仅 coverage.injuries=true 的联赛有数据；亚冠/日韩/中沙卡返回空）"
      - "GET /fixtures/lineups?fixture=<id> （开赛前约 20-40 分钟公布后才有）"
      - "GET /fixtures/headtohead?h2h=<t1>-<t2> （不带 last 参数）"
      - "GET /odds?fixture=<id> （含 Asian Handicap：Pinnacle/SBO/Bet365/Dafabet 等 10 家）"
    restricted:
      - 'season=2026/2027 的任何查询（fixtures?league&season、standings、teams/statistics）→ {"plan": "Free plans do not have access to this season, try from 2022 to 2024."}'
      - 'h2h 的 last 参数 → {"plan": "Free plans do not have access to the Last parameter."}'
      - "h2h 只返回免费档可访问赛季(2022-2024)+当前赛季的交锋（Porto-Napoli 只返回本场）"
  odds_convention: "Asian Handicap 的 value 'Home -0.5' / 'Away -0.5' 中的数字都是主队让球数；'Away -0.5' = 客队 +0.5（由 Betfair 'Home +1.5 @1.06 / Away +1.5 @8.00' 推断）"
the_odds_api:
  base_url: "https://api.the-odds-api.com/v4"
  auth: "query 参数 apiKey，值取 ODDS_API_KEY（环境变量优先，回退 /home/box/.config/ah-secrets.env，可用 AH_SECRETS_FILE 覆盖）；绝不写入仓库"
  plan: Free            # 500 credits/月；odds 调用花费 = markets 数 × regions 数；/sports、/events 免费
  quota_per_month: 500
  reserve: 20           # 剩余 < 20 时客户端拒绝付费调用
  regions: eu           # eu 单区即含 Pinnacle 等 8 家；加 uk 花费翻倍
  markets: spreads      # 亚盘 = spreads（含 ±0.25/0.75 四分之一盘）；alternate_spreads 需逐场 /events/{id}/odds
  role: "多公司亚盘/大小/1X2 交叉核对（优先级：api_football_odds 之后、titan007 之前）"
  usage_file: data/cache/odds_api_usage.json
  point_convention: "outcome.point 为该队让球数（主队 -0.5 = 主让半球）；代码 home_line=主队 point，ah_home_line=-point（titan007 约定正=主让）"
  sport_keys:
    J1: soccer_japan_j_league
    K1: soccer_korea_kleague1
    A-League: soccer_australia_aleague
    CSL: soccer_china_superleague
    Saudi: soccer_saudi_arabia_pro_league   # 注意：soccer_spl 是苏格兰超级联赛（/sports 实测 2026-11-04）
    UCL: soccer_uefa_champs_league
    UEL: soccer_uefa_europa_league
    EPL: soccer_epl
    La Liga: soccer_spain_la_liga
    Serie A: soccer_italy_serie_a
    Bundesliga: soccer_germany_bundesliga
    Ligue 1: soccer_france_ligue_one
    Championship: soccer_efl_champ
  not_covered: [ACL Elite, ACL Two, Qatar Stars League]
  tested_2026-11-04: "UCL spreads eu：9 场，8 家公司（Pinnacle/Marathon/1xBet/GTbets/Coolbet/Matchbook/BetOnline/BetAnything），每家每场只给 1 条主盘"
football_data:
  base_url: "https://api.football-data.org/v4"
  auth: "请求头 X-Auth-Token，值取 FOOTBALL_DATA_KEY（环境变量优先，回退 ah-secrets.env）；绝不写入仓库"
  plan: Free            # 10 次/分钟；读 X-Requests-Available-Minute / X-RequestCounter-Reset 节流，429 退避重试
  role: "补 API-Football 免费档欧洲联赛空缺：当季积分榜、球队近期状态、交锋、按日期赛程/比分；欧洲比赛结算第二比分源（不一致则暂不结算）"
  free_competitions: [PL, ELC, CL, FL1, BL1, SA, PD, PPL, DED, BSA, CLI, EC, WC]   # 无亚洲联赛
  coverage: {epl: PL, championship: ELC, ucl: CL, ligue1: FL1, bundesliga: BL1, seriea: SA, laliga: PD}
  not_covered: [uel, acl_elite, acl_two, j1, j2, k1, aleague, csl, spl, qsl]
  cache: data/cache/football_data/（matches 10m, standings 6h, team matches 3h, h2h 7d）
  tested_2026-11-04: "GET /matches?competitions=CL&dateFrom=2026-11-04 → 9 场；Porto-Napoli id 575392 TIMED；/competitions/CL/standings 当季联赛阶段可用（Porto 第35、Napoli 第24）"
fivedollar:
  base_url: "https://api.5dollarfootballapi.com/v1"
  docs: "https://5dollarfootballapi.com/docs"
  auth: "请求头 Authorization: Bearer <FIVEDOLLAR_KEY>（环境变量优先，回退 ah-secrets.env）；绝不写入仓库"
  plan: Free            # 60 次/小时 + 20 次/分钟上限；X-RateLimit-Limit/Remaining/Reset，429 带 Retry-After；近 3 个月历史
  reserve: 5            # 剩余 <= 5 时拒绝请求；用量记录 data/cache/fivedollar_usage.json
  role: "五大联赛 Bet365 亚盘初盘→即时盘变化（opening/closing/inplay 含水位）；也有赛程/比分/积分榜"
  coverage:             # leagues.yaml id -> 5Dollar league id（GET /leagues 实测，免费档仅 5 个）
    epl: 4160026622
    ligue1: 3614399544
    bundesliga: 686337048
    seriea: 3405541143
    laliga: 4212821298
  line_convention: "asian_handicap.line = 主队让球数（负=主让），closing = 开赛前最新盘"
  free_plan_notes:
    - "fixture 列表（/fixtures、/leagues/{id}/fixtures）在 Free 档不带 odds；单场 /fixtures/{id} 内联盘口线，/fixtures/{id}/odds?market=asian 带水位"
    - "/fixtures/{id}/odds/history 需 Ultra；非 bet365 公司需 Ultra"
    - "公开展示需署名：Football data by 5DollarFootballAPI（报告模板已加）"
  upgrade_option: "Community Access（$0，300 次/小时）可加选一个亚洲国家联赛包（如日本/韩国），适合补 J1/K1 的 Bet365 盘口变化"
  per_pick_cost: 2      # 赛程(6h 窗口，按联赛) + 单场 odds；均有缓存
  tested_2026-11-04: "Leeds-Tottenham(2026-11-07 12:30 UTC, id 2120212024) Bet365 初盘 主-0.25 @2.05/1.80 → 即时 0 @1.90/1.95"
oddspapi:
  base_url: "https://api.oddspapi.io/v4"
  docs: "https://oddspapi.io/en/docs"
  auth: "query 参数 apiKey，值取环境变量 ODDSPAPI_KEY（不写入任何文件）；/v4/account 响应含 api_key，客户端会删除"
  plan: Free            # 250 次/月（每月 1 日重置），1 次计费调用 = 1 请求（含 4xx/5xx）；/historical-odds 免费；/account 不计数；WebSocket 不可用
  quota_per_month: 250
  reserve: 30           # 本地计数 data/cache/oddspapi_usage.json；剩余 <= 30 拒绝计费请求；sync_usage() 用 /account 校准
  role: "亚洲公司亚盘共识（Pinnacle/SBOBet/Singbet/Dafabet/3et/Saba/PS3838/198bet），主要补 The Odds API 不覆盖的亚冠精英/亚冠二/卡塔尔；consensus.attach 中为补充源"
  per_league_cost: "1 次 /fixtures?tournamentId（缓存 12h）+ 每个推荐 1 次 /odds?fixtureId（缓存 30m）"
  tournaments:          # leagues.yaml id -> tournamentId（GET /v4/tournaments?sportId=10，2026-11-04）
    acl_elite: 463
    acl_two: 668
    qsl: 825            # Qatar Stars League
    spl: 955            # Saudi Pro League
    j1: 196
    j2: 402
    k1: 410
    csl: 649
    aleague: 136
    ucl: 7
    championship: 18
  ah_markets: "config/oddspapi_ah_markets.json（marketId 1060..1084 'Asian Handicap h'，outcome '1'=主 '2'=客；h=主队让球数，负=主让）"
  bookmakers_on_free: 366   # 订阅包含 366 家（含 pinnacle/sbobet/singbet/dafabet/ps3838/sabasports）
  tested_2026-11-04: "亚冠精英 Buriram-Kashima（id1000046373835744）242 家有赔率；主盘 Pinnacle 主+0.25 @2.07/1.80、SBOBet 主+0.25 @2.00/1.84、Singbet 主+0.5 @1.81/2.031"
# 2026-11-04 从 box(curl/WebFetch) 实测
working:
  titan007_live_fixtures:
    url: "https://live.titan007.com/vbsxml/bfdata_ut.js?r=007XXXX"
    use: 当日赛程/比分/排名（北京时间）
    notes: 必须带 ?r= 随机参数和 Referer；无参数直接 GET 会被断开
  titan007_odds:
    url: "https://live.titan007.com/vbsxml/goal3.xml?r=007XXXX"
    use: 亚盘(初/即)、欧赔、大小球（默认公司，HK水位）
  titan007_1x2_history:
    url: "https://1x2d.titan007.com/<match_id>.js"
    use: 多家公司欧赔及变化（约380KB/场，未解析）
  websearch_previews:
    use: 伤停/阵容/状态 —— Sports Mole、AFC官网、J.League、Football Italia、BBC、ESPN、WhoScored 预览均可通过 WebSearch 获取
  uefa_fixtures: {url: "https://www.uefa.com/uefachampionsleague/", use: 欧冠赛程}
  jleague_acle: {url: "https://www.jleague.jp/en/acle/game/", use: 亚冠赛程/比分}
  oddsportal:
    url: "https://www.oddsportal.com/"
    status: partial  # HTTP 200 但赔率由 JS 动态加载，curl 拿不到数据；需浏览器
  okooo:
    url: "https://www.okooo.com/"
    status: partial  # 首页 200，未深入测试赔率页
blocked:
  - {name: nowgoal.com, reason: "连接超时/拒绝"}
  - {name: vip.titan007.com, reason: "连接被拒（亚盘变盘明细页）"}
  - {name: zq.titan007.com, reason: "连接被拒（分析/H2H页）"}
untested: [7m.com.cn, aiscore.com, flashscore.com, sofascore.com]
