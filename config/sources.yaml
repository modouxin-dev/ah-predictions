# ---------------------------------------------------------------------------
# 官网爬虫（src/ah/scrapers/，数据官负责）。2026-11-04 北京时间 20:50 前后实测 robots.txt 与条款。
# 通用：诚实 UA（项目名+联系邮箱）、同站请求间隔 >= min_interval_s、缓存 data/cache/scrapers/<site>/、
# ETag/If-Modified-Since 条件请求、429/5xx 指数退避 3 次（尊重 Retry-After）、401/403/验证码直接判失败不绕过。
# 输出 data/snapshots/lineups/<北京日期>/，schema/lineup.schema.json 校验；结构变化写 data/source_status.json（scraper_<site>）。
# 禁止接入：Transfermarkt（条款禁机器人）、K 联赛官网、Sofascore、FotMob /api、球探（另行决定）。
scrapers:
  jleague:
    enabled: true
    base_url: "https://www.jleague.jp"
    min_interval_s: 10          # 每分钟 <= 6 次
    max_retries: 3
    backoff_base_s: 2
    method: "比赛页服务端渲染的 Next.js RSC 数据（页面内嵌 JSON，self.__next_f），英文页 /en/match/<comp>/<year>/<id>/"
    covers: [j1, j2, j3, leaguecup, acle, acl2]   # acle/acl2 仅限有日本球队参加的比赛
    fields: {kickoff: 有, teams: 有, starting_xi: "有（首发公布后）", substitutes: "暂无（前端 JS 加载）", absences: "暂无（停赛前端 JS 加载；伤病不公布）"}
    robots: "允许比赛页；只禁 /match/*/201*（2010 年代旧比赛页）、/application/、/jheader/ 等；User-Agent: spider 全禁（我们的 UA 不含 spider）"
    tos: "利用規約（/general/kiyaku/）未明文禁止自动化访问；禁止妨碍网站运营、侵犯著作权——低频读取、仅内部研究、不转载"
    conditional_requests: "2026-11-04 实测比赛页不返回 ETag/Last-Modified（CloudFront 动态），条件请求代码保留，靠 TTL 与限速控制频率"
    tested_2026-11-04: "acle/2026/110331 神户-叻丕(完场)、110401 浦项-大阪钢巴(完场)、110402 武里南-鹿岛(进行中) 均解析出双方 11 人首发；j1/2026/110706 清水-东京绿茵(赛前) 首发未公布"
    # 亚冠比赛：API-Football fixture id -> J.League 比赛路径（手工维护；lineups/scores 入口自动查）。
    # 来源：jleague.jp/match/ 日程页列出的 ACLE/ACL2 比赛，逐页核对开赛时间与对阵（2026-11-04）。
    acl_match_ids:
      1629967: acle/2026/110332   # 2026-11-03 18:00 柏太阳神 vs 大田韩亚市民
      1629968: acle/2026/110331   # 2026-11-03 18:01 神户胜利船 vs 叻丕
      1629969: acle/2026/110334   # 2026-11-03 20:16 河内公安(API 名 Công An Nhân Dân) vs 京都不死鸟
      1629973: acle/2026/110401   # 2026-11-04 18:00 浦项制铁 vs 大阪钢巴
      1629974: acle/2026/110402   # 2026-11-04 20:16 武里南联 vs 鹿岛鹿角
      1630401: acl2/2026/110503   # 2026-11-05 18:00 町田泽维亚 vs 上海申花
  afc:
    enabled: true
    base_url: "https://www.the-afc.com"
    min_interval_s: 15
    max_retries: 0              # 失败不重试，保证每次运行真实页面请求 ≤ 2
    probe_url: "https://www.the-afc.com/en/club/afc_champions_league_elite.html"
    probe_ttl_s: 21600
    robots: "全部允许（只有 sitemap 声明）"
    tos: "Terms of Service 未明文禁止自动化访问；第 7 条禁止未经书面同意复制/转售内容 -> 只抽取比分事实做内部核对，不转载、不对外发布"
    tos_note: internal-crosscheck-only   # 先知 2026-11-04 审定：只做内部比分核对，只提取对阵+比分，不展示、不转载
    cache_raw: false            # 页面 HTML 只在内存解析、不落盘；只缓存抽取出的对阵+比分（data/cache/scrapers/afc/claims-*.json）
    lineups:
      status: unavailable
      reason: "比赛中心是单页应用，首发由前端 JS 从第三方数据平台加载；sitemap 无比赛页。不做 JS 渲染、不调内部接口 -> 记为失败"
      fallback: "日本球队的 ACLE/ACL2 比赛用 jleague 覆盖（acl_match_ids 映射）；其余亚冠比赛首发只有 API-Football -> 标 unverified"
    scores:
      enabled: true             # 停用开关：改 false，或设环境变量 AH_AFC_SCORES_DISABLED=1，立即停止请求
      max_pages: 2              # 每次核对最多 2 页（ACLE/ACL2 落地页），间隔 ≥15 秒
      status: partial
      method: "赛事落地页（ACLE/ACL2 各 1 页）服务端渲染的 SEO 区块：官方战报标题「MD4: A (KOR) 3-3 B (JPN)」+ 集锦视频链接 slug"
      pages:
        acle: "https://www.the-afc.com/en/club/afc_champions_league_elite.html"
        acl2: "https://www.the-afc.com/en/club/afc_champions_league_two.html"
      coverage: "只含最近有战报/集锦的比赛（2026-11-04 实测 ACLE 3 场、ACL2 4 场）；没出现的比赛记「暂无」"
      requests: "每次核对最多 2 页 + robots.txt（24 小时缓存），间隔 ≥15 秒"
      stored: "只存对阵、国家代码、阶段标记、比分、来源链接；不存页面正文、战报文字或标题原文"
      tested: "2026-11-04 实测，见 data/snapshots/scores/"
  aleagues:
    enabled: true               # 仅做探测；数据不可用
    base_url: "https://aleagues.com.au"
    min_interval_s: 15
    probe_url: "https://aleagues.com.au/matches/a-league-men/"
    probe_ttl_s: 21600
    robots: "允许页面；禁止 /fixtures/loaders/、?tab=、?apiIdentifier=、?destination= 等数据加载/状态参数"
    tos: "Terms of Use 未明文禁止自动化访问；第 11 条仅许可个人非商业使用，禁止转载/公开或商业使用内容"
    status: unavailable
    reason: "比赛列表与比赛中心由前端模板 + Opta 组件渲染（match.api.aleagues.football），数据加载端点被 robots 禁止；sitemap 无比赛页 -> 记为失败"
    lineups_status: "只有 API-Football 单一来源 -> unverified"
  spl:
    enabled: false
    base_url: "https://www.spl.com.sa"
    min_interval_s: 30
    probe_url: "https://www.spl.com.sa/en"
    robots: "允许（只禁 /account、/_libraries、/_test、/_mobileapp 等）"
    tos: "Terms and Conditions 明文：未经书面许可，严禁使用 Robots、Spiders、Offline readers 等自动化系统"
    disabled_reason: "沙特联官网条款明确禁止未经书面许可的机器人/爬虫访问，不抓"
    lineups_status: "只有 API-Football 单一来源 -> unverified"
# ---------------------------------------------------------------------------
# 赔率快照（src/ah/odds_snapshots.py，数据官负责），文档 docs/odds_snapshots.md。
# 输出 data/snapshots/odds/<日报日期>.csv / .summary.json / .map.json（旧路径 data/odds_snapshots/ 只读兼容）；
# ah_home_line 为主队让球（负数=主让）。
odds_snapshots:
  stages: [open, report, close]            # close = 开赛前最后一次报价（开赛前 10 分钟内运行，或赛后 --backfill）
  sources:
    oddspapi:   {endpoint: "/v4/historical-odds", billable: false, max_bookmakers_per_call: 3,
                 bookmakers: [pinnacle, sbobet, singbet, dafabet, sabasports, 3et, ps3838, 198bet], keep_remaining: 30,
                 backoff: "429 指数退避 2s·2^n（最长 60s，尊重 Retry-After / retryMs），最多 3 次；计费请求 5xx 不重试",
                 # 同一端点两次请求的最小间隔（秒），src/ah/oddspapi.py 读取。依据：官方 Rate limits 表
                 # historical-odds 5s / fixtures 2s / 其它 1s / odds 0.5s，各加 ~10% 余量；2026-11-04 按 1.1s 跑
                 # historical-odds 约 34 次请求触发 ~30 次 429，成功请求实际间隔 ~7.6s，说明 1.1s 远低于端点限制。
                 min_interval_seconds: {default: 1.1, historical-odds: 5.5, players: 5.5, fixtures: 2.2,
                                        settlements: 2.2, odds: 0.6, fixture: 0.6}}
    odds_api:   {endpoint: "/v4/sports/{sport}/odds?markets=spreads&regions=eu", cost: "1 credit/联赛", cache_ttl_s: 600,
                 keep_remaining: 20, note: "只有当前盘，不覆盖亚冠二级/卡塔尔"}
    api_football: {endpoint: "/odds?fixture", cost: "1/场（日 100）", mode: auto, floor: 30,
                   note: "auto：只在 Odds API 没覆盖时用"}
    infersports: {endpoint: "/v1/events/{id}/odds?markets=asian_handicap（report/close）、/v1/events/{id}/opening（open）",
                  opt_in: false, note: "用户 2026-11-05 确认：免 key 进默认 SOURCES 并进收盘循环；
                  免 key 200 次/天/IP，每场 report/close 1 次 + 每个开球日期 1 次 events（缓存 30m）"}
  main_line: "完整盘口去水后主队概率最接近 0.5 的线，优先 Pinnacle；单线来源/公司（odds_api、1xbet/coolbet/marathonbet 等）只核价"
  single_line_sources: [odds_api]
  single_line_bookmakers: [1xbet, coolbet, marathonbet, betanything, gtbets, betonline, matchbook]
  overround_warn: 0.06          # 超过则 status_detail 标 high_overround；亚冠联2 Pinnacle 实测同期 6.5–8.4%（非拼价）
  verification: "同一公司 ≥2 来源同一主盘线且两边赔率差 ≤0.06 → verified；主盘线不同但同线价差 ≤0.06 → conflict+same_market（不算 verified）；同主线价差 >0.06 → conflict+same_line_price_diff；单源 single；无数据 missing。取消 verified_ladder"

# ---------------------------------------------------------------------------
# data/sources-v2（2026-11-05）：InferSports 亚洲公司亚盘（免注册免 key 档）。客户端 src/ah/infersports.py。
infersports:
  base_url: "https://api.infersports.dev/v1"
  docs: ["https://infersports.dev/docs", "https://infersports.dev/pricing", "https://infersports.dev/terms", "https://infersports.dev/aup"]
  auth: "免 key 可用（keyless 档）；有 INFERSPORTS_KEY（环境变量或 ah-secrets.env）时发 Authorization: Bearer，绝不写入仓库。申请 key 需注册 → 用户决定"
  plan: keyless         # 200 次/天/IP（UTC 0 点重置）、60 次/分钟、报价新鲜度约 90s；免费 key 5000 次/天
  reserve: 20           # 剩余 <= 20 拒绝请求；用量 data/cache/infersports_usage.json（含 last_request_at，跨进程保证同站 >=10s）
  min_interval_s: 10
  cache_ttl_s: {events: 1800, odds: 90, opening: 21600}   # close 阶段 odds 强制不读缓存
  bookmakers_keyless: [crown, sbobet, macau, m8bet, nova88, hkjc]   # 无 Pinnacle
  maybe_same_book_as: {crown: singbet, nova88: sabasports, m8bet: sabasports}  # 2026-11-05 实测价高度一致，未证实，暂不合并
  leagues:              # leagues.yaml id -> InferSports league.name（/v1/leagues 实测）
    acl_two: AFCTwo
    j1: Jap1
    j2: Jap2
    k1: KoreaK1
    aleague: AUSLA
    spl: SaudiPL
    qsl: QatarSL
    ucl: UCL
    uel: UEL
    epl: ENPL
    laliga: SPA
    seriea: ITA
    bundesliga: GER
    ligue1: FRA
    championship: EFLC
  not_covered: [acl_elite, csl]   # 2026-11-05 /v1/leagues 未见（暂无）
  line_convention: "line = 主队让球（负=主让），与 ah_home_line 相同；suspended 报价价格为 0，丢弃"
  terms: "公测期（public beta，条款 2026-06-08 版）。AUP：遵守本档限流与新鲜度、不得用多 key/多账号规避限流、不得超出本档用途批量抽取、
         原始数据整体转发需另签协议（衍生产品可）、不得接入下单/结算系统。本项目只读取+衍生分析，符合；不得把原始赔率表对外发布"
  tested_2026-11-05: "亚冠二 6 场全部匹配（别名补 BG Pathum/Tai Po/P.P.Crown 后）；report 主盘与 oddspapi 的 sbobet 6/6 同线同价 → verified；初盘 sbobet 3/6 同线、3/6 价差 >0.06（两边初盘取值时间不同）"

# 各来源风险等级（low=官方 API 且条款允许；medium=免费档/条款模糊/依赖第三方转售；high=爬取页面或条款限制；prohibited=禁止接入）
risk_levels:
  api_football: low
  football_data: low
  the_odds_api: low
  oddspapi: low
  fivedollar: low
  infersports: medium        # 新服务、免 key 档按 IP 计数、Asian 公司数据来源未公开
  football_data_co_uk: low   # 只做历史收盘核对
  scrapers.jleague: medium
  scrapers.afc: medium
  scrapers.aleagues: medium
  scrapers.spl: high         # 已禁用
  websearch_previews: medium
  titan007: high             # 降级与否由用户决定，本分支未改动
  okooo: high
  oddsportal: high           # 赔率 JS 加载，条款禁止抓取
  transfermarkt: prohibited
  kleague_official: prohibited
  sofascore: prohibited
  fotmob_api: prohibited

# 交叉核验打标：用户 2026-11-05 确认口径。只打标不自动拦截；双源/3家/verified 不放宽。
# 赛前/收盘看 close，早报看当时 report；空阶段 pending；open 不卡；排除 suspended API-Football。
# 时效用 now 或该阶段最新 captured_at，只看主线 Pin 与 verified 公司。stale 阈值不放宽到 2h/6h。
cross_verification_draft:
  enabled: true
  advisory_only: true
  exclude_sources: [api_football]   # suspended 期间；解封后由先知确认再移除
  same_market: "比较对象 = 同一场同一阶段的主盘线（main_line()，Pinnacle 优先）；ah_home_line 完全相等才算同一市场"
  independence: "独立来源按 source 字段计；公司按 bookmaker 计。同一公司从两个来源看到（如 sbobet 来自 oddspapi+infersports）只算 1 家公司，
                 但该公司 verification=verified 计 1 次‘来源一致’"
  min_sources: {open: 1, report: 2, close: 2}                # 独立 source 数（同一主盘线上有报价）
  min_bookmakers_on_main_line: {open: 2, report: 3, close: 3}
  min_verified_books: {report: 1, close: 1}                   # 至少 1 家公司被 >=2 来源同线同价核实
  require_pinnacle_or_two_asian: "主线有 Pinnacle 报价，或 sbobet/singbet(crown)/sabasports 中 >=2 家同线"
  stale_s:                    # price_ts 距 captured_at（open 用 as_of 距开球）
    open:   {downgrade: null, withdraw: null}                 # 初盘只记录，不按时效降级
    report: {downgrade: 1800, withdraw: 7200}
    close:  {downgrade: 600, withdraw: 1800}
  on_fail: {report: "置信度降一级（中→低即不推）", close: "撤回或标 unverified，不改主线"}
  deep_line:
    field: "abs(ah_home_line) >= 1.75 （主盘行）"
    output: "status_detail 追加 deep_line；summary.matches[].deep_line=true；出单侧直接拦截"
    check_stages: [report, close]                              # 任一阶段主线达到深盘即拦截
