bot_name: 先知                    # 机器人名称（报告/推送/站点统一署名）
# 网站 VIP 前端门禁：只存 SHA-256（不存明文）。改密码：printf '%s' 新密码 | sha256sum
# 注意：仅前端隐藏，数据仍公开在仓库与站点 HTML 中。
vip_password_sha256: "6d19ca72de1fe7973e5a763cdbaf47af34674d4f45a8a2cacd881b751d680a4f"
timezone: "America/Los_Angeles"  # 用户时区（报告内时间统一用 UTC）
report_window_hours: 36          # 覆盖未来多少小时开球的比赛
screening_max_fixtures: 32       # 每日报告初筛上限（窗口内常 60+ 场，24 场会漏掉有真实盘口的比赛）；数据源限速与额度仍生效
max_picks_per_day: 10             # 积累期目标每天 5–10 场，上限 10
min_confidence_to_publish: low     # 2026-11-06 重标定：见文末 MODEL CHANGE 依据；放行低信心正式推荐
# 2026-11-07 按实测分布重标定（MODEL CHANGE，用户授权；见 README「规则档位重标定」）：
#   3 份历史日报共 14 个真实 score：min 2.16 / P50 2.94 / P75 3.33 / P90 3.55 / max 5.00。
#   原 high=7.0 高于实测最大值，数学上不可达；8 因子权重表名义 7.8，但 assess() 实际只写 3 个。
#   新值：high=4.0（略高于 P90、低于历史 max，让最高一档真实可达）、medium=3.0（≈P50）、low=2.0 不变。
#   【必须如实标注】样本仅 14 场、未按概率校准、未经独立回测；这是「规则档位」，不是统计预测准确率，
#   阈值变化不等于准确率提升。伤停/xG/主客场/战意/赛程密度仍标「未取得」，不填 0、不编造。
confidence_thresholds:           # 规则档位（未经独立回测）
  high: 4.0
  medium: 3.0
  low: 2.0
odds_format: hk
require_real_line: true          # 没有真实盘口的比赛绝不推荐
stake_units: 1
telegram:
  chat_id: "-1004312560482"     # 绿茵足球 超级群；Token 走环境变量/Secrets
  bot: "LYZKYPbot"
push_rules:                      # 由 Grok Bot 定时任务执行（报告研究在 Bot 的电脑上完成）
  daily_report:
    time: "10:00"
    timezone: "Asia/Shanghai"    # 北京时间每日推送当日/次日重点比赛
    window_hours: 36
  pre_match_final_check:
    minutes_before_kickoff: 50   # 复核临场盘口/水位、官方首发、关键伤停；只保留仍成立的推荐
    actions: [keep, adjust, cancel]
  post_match_backtest:
    minutes_after_kickoff: 135   # 赛果、亚盘结算、是否命中、简要复盘、累计命中率
  targets:
    telegram_chat_id: "-1004312560482"
    web: "https://modouxin-dev.github.io/ah-predictions/"

# 2026-11-06 MODEL CHANGE 依据（实测，非推测）：
#   analyze.WEIGHTS 共 8 个因子，但 build_report 实际只填 form / h2h(可选) / line_movement(自动)，
#   已填权重上限 1.2+0.3+1.5=3.0，score 理论上限约 6.0，原 high=7.0 数学上不可达；
#   13:38 重采的 24 场里仅 1 场走到评分（Leeds vs Tottenham score=3.55），
#   其余 14 场被「盘口跨来源核验未通过」硬拦、8 场评分不足、2 场近期状态不足。
#   故：medium 4.5→3.5、low 3.0→2.0、两处发布门槛→低，并让 sources.yaml 的 advisory_only 生效。
#   所有推荐仍只用真实盘口与真实赛果；核验未完全通过的场次强制低信心 + 显式风险标注，不编造结论。
# 准确率优先策略（低信心场次如实标注，不伪装成已核验）—— src/ah/policy.py
# 积累期：正式发「中」及以上；样本够、模型稳后再收回「只发高」。深盘 |line|≥1.75 默认进观察。
# 2026-11-07 因子三态准入（深度研究报告第一/三/八节）。
# off=不记录；observation=只写证据不进 score（默认，线上结果不变）；scoring=带 full 证据才进 score。
# 不额外调用接口：输入来自报告、football-data 已缓存 standings、form_history 已落盘赛果。
# 自动验收由 research-backtest.yml 每日跑 factors readiness；达标且离线重放不把推荐打回 0 才 promote。
feature_scoring:
  mode: observation
  promotion:
    min_consecutive_days: 14      # 连续覆盖达标天数；研究建议 14 个自然日
    min_coverage_ratio: 0.80      # 当日有 full 证据的场次占比
    min_samples: 80               # 每因子累计 full 样本（研究口径每概率桶 80-100）
    reject_if_replay_zero_picks: true

policy:
  min_confidence_to_publish: 低      # 2026-11-06：低及以上；核验未完全通过的场次强制标低信心并注明风险
  max_picks_per_day: 10             # 积累期目标每天 5–10 场，上限 10
  max_abs_line_to_publish: 1.75     # |line|≥1.75 默认不进正式，进 watchlist（深盘）
  hit_rate_by_confidence: true      # 高/中分账命中率（统计侧 by_confidence）
  require_real_odds: true
  consensus_alignment: "pick line within 0.25 of multi-book median, else downgrade or skip"
  alignment_tolerance: 0.25         # >0.25 降一档；>0.5 直接撤下
  prematch_cancel_on_confidence_drop: true
  effective_from: "2026-11-05"      # 此前报告（2026-11-04）保留为历史记录，不改写
