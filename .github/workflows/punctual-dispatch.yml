name: Punctual dispatch (zero-registration, no external account)
# 让准点能力收进仓库本身：GitHub 自带 schedule 实测迟到 4.7~6.8h，
# 这个每 5 分钟的轻量工作流按北京目标时刻用 REST API 触发 daily.yml。
# 零注册、零外部账号、零额外密钥（只用 runner 自带的 GITHUB_TOKEN）。
# 不改报告/台账/评分/阈值/核验/推送；不生成任何赛程盘口水位比分倾向。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      verify:
        description: '链路自检：真发一次 slot=1 dispatch 并核对是否新建 run（推送会被幂等跳过）'
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: write      # 仅在 verify 模式提交一份事实 JSON 回 main（日志/artifact 下载被网络策略拦截）
  actions: write
concurrency:
  group: punctual-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # punctual 只用标准库；装依赖仅为与仓库其它 CLI 保持同一运行环境
      - run: pip install -r requirements.txt
      - name: Decide and dispatch (facts only, idempotent by date+slot)
        run: |
          if [ "${{ inputs.verify }}" = "true" ]; then
            python -m ah punctual --verify | tee punctual_facts.json
          else
            python -m ah punctual --apply | tee punctual_facts.json
          fi
      - name: Persist dispatch log (only when a dispatch actually happened)
        if: ${{ inputs.verify != true }}
        run: |
          # 必须用 status --porcelain：日志首次生成是「未跟踪新文件」，
          # git diff --quiet 对未跟踪文件返回 0，会误判成「无变化」而漏提交。
          if [ -n "$(git status --porcelain -- data/punctual_dispatch_log.json)" ]; then
            scripts/safe_commit.sh --skip-tests \
              -m "OPS: punctual dispatch log (date+slot idempotency, facts only)" \
              data/punctual_dispatch_log.json \
              || echo "::warning::dispatch log 提交失败；台账幂等仍可防重复推送"
          else
            echo "[punctual] 本次无 dispatch，不写仓库"
          fi
      - name: Upload decision facts as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punctual-facts-${{ github.run_id }}
          path: punctual_facts.json
          if-no-files-found: ignore
      # 网络出口被拦时换通道：把自检事实提交回 main，从 contents API 读回。
      # 日常 schedule 运行不写仓库（避免每 5 分钟刷一次提交）。
      - name: Publish verification facts back to main
        if: ${{ inputs.verify == true }}
        run: |
          cp punctual_facts.json data/punctual_verify.json
          scripts/safe_commit.sh --skip-tests \
            -m "OPS: punctual link verification facts (no token echoed)" \
            data/punctual_verify.json \
            || echo "::warning::验证事实提交失败（不影响任何推送）"
