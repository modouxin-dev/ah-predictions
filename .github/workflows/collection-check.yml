name: Check live collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collection-check.yml']
permissions:
  contents: read
concurrency:
  group: collection-check
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Check backup form source
        run: |
          python -u - <<'PY'
          from datetime import datetime, timezone
          from ah import fivedollar
          from ah.match import parse_dt
          c = fivedollar.Client()
          if not c.enabled:
              print('5Dollar 近期赛果：未配置')
          else:
              try:
                  now = datetime.now(timezone.utc)
                  ids = {str(value): key for key, value in fivedollar.LEAGUE_IDS.items()}
                  games = c.fixtures(now, hours=24)
                  candidates = [g for g in games if str((g.get('league') or {}).get('id')) in ids
                                and g.get('status') == 'scheduled' and parse_dt(g['kickoff_utc']) > now]
                  if not candidates:
                      print('5Dollar 近期赛果：未来24小时无可测试的支持联赛')
                  else:
                      g = candidates[0]
                      f = fivedollar.fundamentals(c, ids[str(g['league']['id'])], g['teams']['home']['name'],
                                                 g['teams']['away']['name'], g['kickoff_utc'], now)
                      form = f.get('form') or {}
                      print('5Dollar 近期赛果：主队', len(form.get('home', '')),
                            '场，客队', len(form.get('away', '')), '场')
              except Exception as exc:
                  print('5Dollar 近期赛果检查失败：', type(exc).__name__)
          PY
      - name: Preview current fixtures and recommendations
        run: |
          python -u - <<'PY'
          import json
          from datetime import datetime, timezone
          from ah import analyze, daily, odds_snapshots

          now = datetime.now(timezone.utc)
          date = now.date().isoformat()
          original = analyze.select
          def inspect(candidates, cfg):
              for candidate in candidates:
                  print('SCORE', json.dumps({'match': candidate.match_id, 'side': candidate.pick_side,
                        'score': analyze.score(candidate), 'features': candidate.features,
                        'line_open': candidate.line_open, 'line': candidate.line}, ensure_ascii=False), flush=True)
              return original(candidates, cfg)
          analyze.select = inspect
          report = daily.build_report(date)
          rows = odds_snapshots.load_rows(odds_snapshots.paths(date)['csv'])
          cfg = odds_snapshots.load_cross_verification()
          print('REPORT', json.dumps(report, ensure_ascii=False), flush=True)
          for item in report['watchlist']:
              mid = item['match_id']
              check = odds_snapshots.evaluate_cross_verification(rows, mid, 'report', cfg,
                                                                  now=datetime.now(timezone.utc))
              selected = [{k: r.get(k) for k in ('source', 'bookmaker', 'verification', 'price_ts',
                          'ah_home_line', 'odds_home', 'odds_away')}
                          for r in rows if r.get('match_id') == mid and r.get('stage') == 'report'
                          and str(r.get('is_main')) == '1' and (r.get('verification') == 'verified'
                          or r.get('bookmaker') == 'pinnacle')]
              print('ODDS', json.dumps({'match': mid, 'check': check, 'quotes': selected}, ensure_ascii=False), flush=True)
          PY
