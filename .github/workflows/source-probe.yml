name: Source runtime selfcheck
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 09:00 北京时间，先于日报；只输出事实，不发消息、不写报告
permissions:
  contents: read
concurrency:
  group: source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Keyless source health (facts only, no registration needed)
        continue-on-error: true
        run: |
          # 注册源自检之外，也看一眼免注册公开源是否可连通；只记 HTTP 状态，
          # 不解析内容、不生成赛程/盘口/水位、不写报告、不推断失败原因。
          python -m ah source-audit --probe-keyless | tee keyless_source_facts.txt
      - name: Credential policy facts (optional enhancement declarations)
        continue-on-error: true
        run: python -m ah source-policy --out source_policy_facts.json
      - name: Record observable facts only
        continue-on-error: true
        run: |
          python -m ah source-probe --json source_probe_facts.json | tee source_probe_facts.txt
      - name: Upload facts as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-facts
          path: |
            source_probe_facts.txt
            source_probe_facts.json
            keyless_source_facts.txt
            source_policy_facts.json
          if-no-files-found: ignore
