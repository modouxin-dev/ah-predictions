name: One-time source check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-check-once.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.event.head_commit.message == 'Inspect odds sources once 2026-11-06'
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
    steps:
      - name: Check sources and upcoming matches
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.error, urllib.parse, urllib.request
          for name in ['API_FOOTBALL_KEY', 'ODDS_API_KEY', 'ODDSPAPI_KEY', 'FOOTBALL_DATA_KEY', 'FIVEDOLLAR_KEY']:
              print(name + ': ' + ('configured' if os.environ.get(name) else 'missing'))
          print('API-Football: disabled by repository safety switch; no request made')
          def get(url, headers=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers or {}), timeout=25) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code, None
              except Exception:
                  return 'network_error', None
          now = dt.datetime.now(dt.timezone.utc)
          end = now + dt.timedelta(hours=36)
          competitions = {'PL':'soccer_epl', 'ELC':'soccer_efl_champ', 'BL1':'soccer_germany_bundesliga', 'PD':'soccer_spain_la_liga', 'SA':'soccer_italy_serie_a', 'FL1':'soccer_france_ligue_one'}
          fixtures = []
          if os.environ.get('FOOTBALL_DATA_KEY'):
              params = urllib.parse.urlencode({'dateFrom': now.date().isoformat(), 'dateTo': end.date().isoformat(), 'competitions': ','.join(competitions)})
              status, data = get('https://api.football-data.org/v4/matches?' + params, {'X-Auth-Token': os.environ['FOOTBALL_DATA_KEY']})
              print('football-data HTTP:', status)
              for m in (data or {}).get('matches', []):
                  start = dt.datetime.fromisoformat(m['utcDate'].replace('Z', '+00:00'))
                  code = m.get('competition', {}).get('code')
                  if now < start <= end and code in competitions and m.get('status') in ('SCHEDULED', 'TIMED'):
                      fixtures.append({'competition':code, 'time':m['utcDate'], 'home':m['homeTeam']['name'], 'away':m['awayTeam']['name']})
              print('UPCOMING_FIXTURES:', json.dumps(fixtures, ensure_ascii=False))
          if os.environ.get('ODDS_API_KEY'):
              key = os.environ['ODDS_API_KEY']
              status, data = get('https://api.the-odds-api.com/v4/sports?' + urllib.parse.urlencode({'apiKey':key}))
              print('The Odds API sports HTTP:', status)
              active = {s['key'] for s in data if s.get('active')} if isinstance(data, list) else set()
              requested = {'soccer_japan_j_league', 'soccer_australia_aleague', 'soccer_efl_champ', 'soccer_france_ligue_one', 'soccer_germany_bundesliga', 'soccer_spain_la_liga'}
              sports = sorted(({competitions[f['competition']] for f in fixtures} or requested) & active)
              for sport in sports[:6]:
                  params = urllib.parse.urlencode({'apiKey':key, 'regions':'eu', 'markets':'spreads', 'oddsFormat':'decimal'})
                  status, events = get('https://api.the-odds-api.com/v4/sports/' + sport + '/odds?' + params)
                  print('ODDS_STATUS:', sport, status)
                  clean = []
                  for event in events if isinstance(events, list) else []:
                      start = dt.datetime.fromisoformat(event['commence_time'].replace('Z', '+00:00'))
                      if now < start <= end:
                          books = [{'book':b.get('title'), 'updated':m.get('last_update'), 'outcomes':m.get('outcomes')} for b in event.get('bookmakers', []) for m in b.get('markets', []) if m.get('key') == 'spreads']
                          clean.append({'time':event['commence_time'], 'home':event['home_team'], 'away':event['away_team'], 'books':books[:12]})
                  print('ODDS_EVENTS:', json.dumps(clean, ensure_ascii=False))
          PY
