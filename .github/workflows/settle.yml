name: settle-and-stats
on:
  schedule:
    # 结算必须晚于当日最晚开球 + 110 分钟（autofill 的最小等待）；
    # 报告里最晚场次为北京 23:00（UTC 15:00），故晚班定在 UTC 18:00（北京次日 02:00）。
    - cron: "0 9 * * *"    # 早班：北京 17:00，结算前一日/凌晨已完场遗留
    - cron: "0 18 * * *"   # 晚班：北京次日 02:00，覆盖当日全部开球场次
    - cron: "30 19 * * *"  # 备用：GitHub cron 实测会延迟/丢失（曾漂到 16:28 UTC 且失败）；
                           # settle 以 settled 标记幂等，重复触发不会重复计数。
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: settle
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}   # 可选；未设置时跳过自动回填
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m ah settle && python -m ah stats
      - run: |
          scripts/safe_commit.sh --skip-tests -m "settle $(date -u +%F)" data/predictions.csv data/stats.json reports
      # 失败可见：无论成功/失败都写一份事实盘点，列出仍未结算的条目；
      # 只读取 CSV 现有字段，赛果为空写「未取得」，绝不补造比分或假称已补齐。
      - name: Third score truth cross-check (read-only, keyless)
        if: always()
        continue-on-error: true
        run: |
          # DATA SOURCE: 免注册第三比分源只读一致性核对。抓不到/认不出写「未取得」；
          # AGREE 不写真值、DISAGREE 不自动改写结算，真值回填默认关闭。
          python -m ah score-truth --out data/score_truth_check.json
      - name: Credential policy facts
        if: always()
        continue-on-error: true
        run: python -m ah source-policy --out data/source_policy.json
      - name: Record settle health (facts only)
        if: always()
        run: |
          python -m ah gaps health \
            --run-id "${{ github.run_id }}" \
            --conclusion "${{ job.status }}" \
            --event "${{ github.event_name }}"
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::结算任务未成功；未结算清单见 data/settle_health.json（不填比分、不假称补齐）"
          fi
      - name: Commit settle health
        if: always()
        run: |
          scripts/safe_commit.sh --skip-tests -m "settle health $(date -u +%F)" \
            data/settle_health.json data/score_truth_check.json data/source_policy.json \
            || echo "::warning::健康盘点提交失败，见上方日志"
