name: settle-and-stats
on:
  schedule:
    - cron: "0 9 * * *"   # 每天 09:00 UTC，欧洲/美洲比赛已完场
  workflow_dispatch:
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: src}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      # TODO: 自动回填比分（fetch_fixtures 完场 state=-1 的 home_goals/away_goals → predictions.csv.result）
      - run: python -m ah settle && python -m ah stats
      - run: |
          git config user.name "ah-bot"; git config user.email "ah-bot@users.noreply.github.com"
          git add data && git commit -m "settle $(date -u +%F)" || echo "nothing to commit"
          git push
