name: settle-and-stats
on:
  schedule:
    - cron: "0 9 * * *"   # 每天 09:00 UTC，欧洲/美洲比赛已完场
  workflow_dispatch:
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}   # 可选；未设置时跳过自动回填
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m ah settle && python -m ah stats
      - run: |
          git config user.name "ah-bot"; git config user.email "ah-bot@users.noreply.github.com"
          git add data/predictions.csv data/stats.json && git commit -m "settle $(date -u +%F)" || echo "nothing to commit"
          git push
