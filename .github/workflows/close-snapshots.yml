name: Capture closing lines (CLV prerequisite)
# DATA SOURCE: config/sources.yaml 与 odds_snapshots.py 早已定义 stage=close，
# 但此前没有 workflow 跑它，导致仓库里只有 open/report 两阶段、CLV 无法计算。
# 本任务只补采收盘快照，不改任何评分/核验/阈值/展示逻辑；失败只落事实，不补造盘口。
on:
  schedule:
    - cron: "0 19 * * *"   # 北京次日 03:00：覆盖当日晚场完赛后的历史收盘
    - cron: "0 22 * * *"   # 北京次日 06:00：GitHub cron 延迟兜底
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: close-snapshots
  cancel-in-progress: true
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}   # --backfill 只用 OddsPapi 历史（免费）
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Capture stage=close snapshots (facts only, no fabrication)
        id: snap
        continue-on-error: true
        run: |
          # 只用开赛后历史盘口补跑；缺凭据、接口失败都不补造任何 line/odds。
          python -m ah.odds_snapshots close --backfill
      - name: Record capture fact
        if: always()
        env:
          OUTCOME: ${{ steps.snap.outcome }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          outcome = os.environ.get("OUTCOME", "未取得")
          import csv
          close_rows, valid_close_rows, close_mids = 0, 0, set()
          for p in sorted(Path("data/snapshots/odds").glob("*.csv")):
              try:
                  with p.open(encoding="utf-8", newline="") as f:
                      for r in csv.DictReader(f):
                          if str(r.get("stage") or "").strip().lower() == "close":
                              close_rows += 1
                              mid = str(r.get("match_id") or "").strip()
                              if mid:
                                  close_mids.add(mid)
                              if str(r.get("ah_home_line") or "").strip():
                                  valid_close_rows += 1
              except (OSError, UnicodeError, csv.Error):
                  pass
          fact = {
              "schema": 1,
              "checked_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "capture_outcome": outcome,
              "close_rows_in_repo": close_rows,
              "close_rows_with_line": valid_close_rows,
              "close_unique_match_ids": len(close_mids),
              "note": "用 csv 模块解析 stage 列（不再按逗号切分，避免字段内逗号误数）；"
                      "只记录真实存在的行数/唯一场次/带盘口行数；失败不补造盘口、不推断原因。"
                      "行数不等于可 join 的场次，需再与 predictions.csv 的 match_id 求交。",
              "unverified": ["收盘快照是否覆盖全部已结算场次", "收盘价是否即该机构最终收盘价"],
          }
          Path("data/close_capture.json").write_text(
              json.dumps(fact, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("CLOSE_CAPTURE", json.dumps(fact, ensure_ascii=False))
          PY
      - name: Commit close snapshots and fact (race-safe)
        if: always()
        run: |
          # 共用安全提交脚本：并发 push 竞争自动 rebase 重试；绝不补造盘口。
          scripts/safe_commit.sh --skip-tests \
            -m "DATA SOURCE: captured stage=close odds snapshots (facts only)" \
            data/snapshots/odds data/close_capture.json \
            || echo "::warning::收盘快照提交失败，见上方日志；事实已在 data/close_capture.json 记录"
