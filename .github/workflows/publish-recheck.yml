name: Publish live recheck
on:
  # 已取消定时：daily-report 每天 4 次推送（北京 07/11/16/22 点）复用同一次采集；
  # 本流程每次都会完整重采（耗赔率接口额度），仅保留手动触发。
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-recheck
  # 涉及临场消息发送：不取消在途 run，避免漏发
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Facts-only destination preflight
        run: python -m ah delivery preflight
      - name: Check API-Football status (facts only)
        run: |
          python - <<'PY'
          from ah import api_football
          client = api_football.Client()
          if not client.enabled:
              print('API-Football: not configured or disabled')
          else:
              try:
                  data = client.status()
                  print('API-Football status reachable; subscription active:',
                        (data.get('subscription') or {}).get('active', 'unknown'))
              except Exception as exc:
                  print('API-Football status unavailable:', type(exc).__name__)
                  if client.disabled_reason() and 'suspend' in client.disabled_reason().lower():
                      print('API-Football account suspended; source disabled for this run')
          PY
      - name: Build live report
        run: |
          D=$(date -u +%F)
          STEM="${D}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          F="reports/rechecks/${D:0:4}/${D:5:2}/${STEM}.json"
          echo "RECHECK_FILE=$F" >> "$GITHUB_ENV"
          echo "RECHECK_SNAPSHOT_DIR=data/snapshots/odds/rechecks/$STEM" >> "$GITHUB_ENV"
          python -u -m ah.recheck collect --path "$F"
      - name: Save report and odds evidence
        run: |
          paths=("$RECHECK_FILE" "$RECHECK_SNAPSHOT_DIR")
          if [ -d data/history ]; then paths+=(data/history); fi
          scripts/safe_commit.sh --skip-tests -m "save live recheck $GITHUB_RUN_ID" "${paths[@]}"
      - name: Send report to Telegram
        run: python -m ah.recheck send --path "$RECHECK_FILE"
      - name: Record sent official recommendations
        run: |
          python -m ah.recheck record --path "$RECHECK_FILE"
          scripts/safe_commit.sh --skip-tests -m "record sent recheck $GITHUB_RUN_ID" data/predictions.csv
      - name: Commit delivery evidence
        run: |
          scripts/safe_commit.sh --skip-tests -m "telegram recheck delivery $GITHUB_RUN_ID" data/telegram_delivery.json
