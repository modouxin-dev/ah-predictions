name: daily-report
on:
  schedule:
    - cron: "0 2 * * *"   # 每天 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Generate daily report
        id: report
        run: |
          D=$(date -u +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          F=reports/${D:0:4}/${D:5:2}/$D.json
          if [ -f "$F" ]; then
            echo "今日报告已存在，避免覆盖及重复推送"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            python -m ah.daily --date "$D"
            python -m ah render "$D"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit
        if: ${{ steps.report.outputs.created == 'true' }}
        run: |
          D="${{ steps.report.outputs.date }}"
          [ -f var/source_status.json ] && cp var/source_status.json data/source_status.json || true
          scripts/safe_commit.sh --skip-tests -m "daily report $D" reports data/predictions.csv data/snapshots/odds data/source_status.json
      - name: Check Telegram configuration
        if: ${{ steps.report.outputs.created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram 密钥未配置，无法发送日报"
            exit 1
          fi
      - name: Publish Telegram
        if: ${{ (steps.report.outputs.created == 'true' || github.event_name == 'workflow_dispatch') && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          D="${{ steps.report.outputs.date }}"
          F=reports/${D:0:4}/${D:5:2}/$D.json
          echo "=== Telegram push check ==="
          echo "Date: $D"
          echo "Report file: $F"
          if [ ! -f "$F" ]; then
            echo "❌ 没有找到今日报告 JSON，跳过推送"
            exit 0
          fi
          echo "✅ 找到报告，开始推送..."
          python -m ah telegram $D
          echo "✅ 推送完成"
