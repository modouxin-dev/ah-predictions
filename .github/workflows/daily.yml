name: daily-report
on:
  schedule:
    # 一天 4 次推送（北京 07:00 / 11:00 / 16:00 / 22:00）。时区换算：北京 = UTC+8。
    # 第 1 次：22:00 UTC（北京 06:00）开始采集，publish 等到 23:00 UTC（北京 07:00）再发；
    # 第 2/3/4 次：03:00 / 08:00 / 14:00 UTC 直接推送，复用当日采集数据，仅列尚未开赛场次。
    # 若早间采集失败，后续时段会自动补一次完整采集与推送（兜底）。
    - cron: "0 22 * * *"
    - cron: "0 3 * * *"
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
  # 编排增强（本次会话）：手动触发可指定 slot=1，用于补跑已错过的 07:00 班次。
  workflow_dispatch:
    inputs:
      slot:
        description: '推送时段：1=完整日报(等到北京07:00)，2/3/4=更新，manual=立即'
        required: false
        default: '1'
permissions:
  contents: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  collect:
    name: 采集并生成日报（不负责推送）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Resolve slot and Beijing date (by cron target time, not by actual run time)
        env:
          AH_SCHEDULE: ${{ github.event.schedule }}
          AH_INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          # GitHub cron 常延迟数小时：日期取「定时目标时刻」的北京日期，避免延迟班次跨过北京午夜后
          # 被当成次日而整轮重采、凌晨推送。
          python -m ah delivery resolve >> "$GITHUB_ENV"

      - name: Data source runtime selfcheck (facts only)
        continue-on-error: true
        run: |
          # 把运行时代理自检的结构化事实写入仓库；失败也保留事实，不推断原因
          python -m ah source-probe --json data/source_probe_facts.json

      - name: Skip collection when not needed
        id: skip
        run: |
          D="$AH_DATE"
          F="reports/${D:0:4}/${D:5:2}/${D}.json"
          # 更新时段 2/3/4：当日报告已存在就复用，不重复消耗赔率接口额度；缺失才兜底重采。
          case "$AH_SLOT" in
            2|3|4)
              if [ -f "$F" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "[skip] 更新时段 $AH_SLOT：复用当日报告 $F，不重新采集"
                exit 0
              fi ;;
            manual)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "[skip] 手动验证：完整重采"
              exit 0 ;;
          esac
          # 时段 1（早间版）：本时段已送达带推荐的日报才跳过（重跑幂等）；
          # 其它时段（如凌晨兜底）留下的记录不影响早间版的新鲜采集。
          if D="$D" S="$AH_SLOT" python - <<'PY'
          import json, os, sys
          p = 'data/telegram_delivery.json'
          d = json.load(open(p, encoding='utf-8')) if os.path.exists(p) else {'deliveries': []}
          rows = [r for r in d.get('deliveries', [])
                  if r.get('date') == os.environ['D'] and str(r.get('slot', '1')) == os.environ['S']
                  and r.get('status') == 'sent' and r.get('message_ids')]
          sys.exit(0 if any(int(r.get('picks_count') or 0) > 0 for r in rows) else 1)
          PY
          then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[skip] 时段 $AH_SLOT 今日已推送带推荐的日报，跳过重复采集"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect and regenerate daily report
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          D="$AH_DATE"
          F="reports/${D:0:4}/${D:5:2}/${D}.json"
          # 显式 --refresh：每次运行都用当前数据源重新采集，不复用旧报告（编排层开关）。
          # 初筛上限 32（原 24 会漏掉有真实盘口的比赛）；不改评分/核验/阈值。
          python -m ah.daily --date "$D" --refresh --max-fixtures 32
          python -m ah render "$D"
          # 0 场兜底：若采集无错误但规则筛完 0 场，再扩到 48 场重采一次。
          # 只扩大候选池，不改模型算法；仍 0 场则如实推送赛程事实清单，绝不编造预测。
          if D="$D" F="$F" python - <<'PY'
          import json, os, sys
          r = json.load(open(os.environ['F'], encoding='utf-8'))
          sys.exit(0 if (not r.get('picks') and not r.get('collection_errors')) else 1)
          PY
          then
            echo "ZERO_PICK_FALLBACK 采集无错误但 0 场推荐：扩大初筛到 48 场再采一次"
            python -m ah.daily --date "$D" --refresh --max-fixtures 48
            python -m ah render "$D"
          fi
          test -f "$F"
          python -m ah grounding --report "$F"
          # 样本池：把本次筛过的全部候选（含未推荐）逐条落盘，只做事实留档，
          # 不改报告、不生成预测；推送仍只发 policy.published 的正式推荐。
          python -m ah samples pool "$D"
          # 逐场因子覆盖事实（自动验收的输入）；observation 模式不改评分结果。
          python -m ah factors coverage "$D"

      - name: Stage report for this run
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          D="$AH_DATE"
          mkdir -p _stage
          cp "reports/${D:0:4}/${D:5:2}/${D}.json" _stage/report.json
          cp "reports/${D:0:4}/${D:5:2}/${D}.md" _stage/report.md 2>/dev/null || true

      - name: Upload report artifact
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: _stage/
          retention-days: 1
          if-no-files-found: error

      - name: Commit report
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          D="$AH_DATE"
          [ -f var/source_status.json ] && cp var/source_status.json data/source_status.json || true
          paths=(reports data/predictions.csv data/snapshots/odds data/samples data/feature_coverage data/source_status.json data/source_probe_facts.json)
          if [ -d data/history ]; then paths+=(data/history); fi
          scripts/safe_commit.sh --skip-tests -m "daily report $D" "${paths[@]}"

  publish:
    name: 推送 Telegram（独立 job，采集失败不阻断）
    needs: collect
    if: ${{ always() && needs.collect.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Resolve slot and Beijing date (by cron target time, not by actual run time)
        env:
          AH_SCHEDULE: ${{ github.event.schedule }}
          AH_INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          # GitHub cron 常延迟数小时：日期取「定时目标时刻」的北京日期，避免延迟班次跨过北京午夜后
          # 被当成次日而整轮重采、凌晨推送。
          python -m ah delivery resolve >> "$GITHUB_ENV"

      # 关键根因修复：publish 原本只靠 main 上已提交的报告；collect 的 git push 一旦失败，
      # 这里就会拿到旧报告甚至 0 场版本。改为优先使用本次运行采集的 artifact。
      - name: Download this run's report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: _artifact

      - name: Use artifact report (not stale main checkout)
        run: |
          D="$AH_DATE"
          F="reports/${D:0:4}/${D:5:2}/${D}.json"
          if [ -f "_artifact/report.json" ]; then
            mkdir -p "$(dirname "$F")"
            cp _artifact/report.json "$F"
            if [ -f "_artifact/report.md" ]; then cp _artifact/report.md "${F%.json}.md"; fi
            echo "ARTIFACT_REPORT_USED=true 本次采集产物已覆盖 checkout 报告：$F"
          else
            echo "ARTIFACT_REPORT_USED=false 本次未上传 artifact（collect 已跳过），沿用 main 上已送达的报告"
          fi

      - name: Record report provenance (facts only)
        id: provenance
        env:
          COLLECT_RESULT: ${{ needs.collect.result }}
        run: |
          echo "AH_COLLECT_RESULT=$COLLECT_RESULT" >> "$GITHUB_ENV"
          if [ -f "_artifact/report.json" ]; then
            echo "AH_REPORT_SOURCE=fresh-artifact" >> "$GITHUB_ENV"
            echo "[provenance] 使用本次采集产物"
          else
            echo "AH_REPORT_SOURCE=main-checkout" >> "$GITHUB_ENV"
            echo "::warning::本次运行未取得采集产物；沿用 main 上已存在的报告，来源写入台账，不标记为新采集"
          fi

      - name: Fail closed if report missing
        run: |
          D="$AH_DATE"
          F="reports/${D:0:4}/${D:5:2}/${D}.json"
          if [ ! -f "$F" ]; then
            echo "::error::当日报告不存在，拒绝发送不存在的报告：$F"
            exit 1
          fi
          echo "报告存在：$F"

      - name: Wait until 07:00 Beijing (23:00 UTC) before the first publish of the day
        run: |
          if [ "$AH_SLOT" != "1" ]; then
            echo "更新/手动时段 $AH_SLOT：不等待，立即处理"
            exit 0
          fi
          python - <<'PY'
          import time
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          target = now.replace(hour=23, minute=0, second=0, microsecond=0)
          diff = (target - now).total_seconds()
          if 0 < diff <= 5400:
              print(f"等待到 07:00 北京时间，剩余 {int(diff)} 秒")
              time.sleep(diff)
          else:
              print("已过 07:00 北京时间（GitHub 定时延迟）或启动过早，按采集完成时间推送")
          print(f"PUBLISH_AT_UTC {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          PY

      - name: Delivery decision (slot-aware, one delivery per slot)
        id: gate
        run: python -m ah delivery check >> "$GITHUB_OUTPUT"
      - name: Facts-only destination preflight
        if: ${{ steps.gate.outputs.should_send == 'true' }}
        run: python -m ah delivery preflight
      - name: Grounding gate (fail-closed)
        if: ${{ steps.gate.outputs.should_send == 'true' }}
        run: python -m ah grounding --report "reports/${AH_DATE:0:4}/${AH_DATE:5:2}/${AH_DATE}.json"
      - name: Publish Telegram
        if: ${{ steps.gate.outputs.should_send == 'true' }}
        run: python -m ah delivery send
      - name: Commit delivery evidence
        if: ${{ steps.gate.outputs.should_send == 'true' }}
        run: |
          scripts/safe_commit.sh --skip-tests -m "telegram delivery $AH_DATE slot $AH_SLOT" data/telegram_delivery.json
