name: daily-report
on:
  schedule:
    - cron: "0 2 * * *"   # 每天 02:00 UTC（北京时间 10:00）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}           # 可选；未设置时跳过多家公司共识   # 可选；未设置时 fetch_fixtures 回退 titan007
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fetch fixtures & odds
        run: |
          mkdir -p data/raw
          python -m ah.fetch_fixtures > data/raw/fixtures_$(date -u +%F).json || echo "fixtures fetch failed"
          python -m ah.fetch_odds > data/raw/odds_$(date -u +%F).json || echo "odds fetch failed"
      # TODO: analyze 需要基本面特征；当前由研究代理生成 reports/YYYY/MM/DATE.json 后再进入下一步
      - name: Render report (if JSON exists)
        run: |
          D=$(date -u +%F); F=reports/${D:0:4}/${D:5:2}/$D.json
          if [ -f "$F" ]; then python -m ah consensus $D || echo "consensus skipped"; python -m ah render $D; else echo "no report json for $D"; fi
      - name: Commit
        run: |
          git config user.name "ah-bot"; git config user.email "ah-bot@users.noreply.github.com"
          # 数据源运行状态写在 var/（不入库），这里复制为快照 data/source_status.json 一起提交
          [ -f var/source_status.json ] && cp var/source_status.json data/source_status.json || true
          git add reports data && git commit -m "daily report $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Publish Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          D=$(date -u +%F)
          F=reports/${D:0:4}/${D:5:2}/$D.json
          echo "=== Telegram push check ==="
          echo "Date: $D"
          echo "Report file: $F"
          if [ ! -f "$F" ]; then
            echo "❌ 没有找到今日报告 JSON，跳过推送"
            exit 0
          fi
          echo "✅ 找到报告，开始推送..."
          python -m ah telegram $D
          echo "✅ 推送完成"
