name: Online-rule research (walk-forward / calibration)
# MODEL CHANGE 授权的**研究层**产物：只做时序评估与校准可得性盘点。
# 不改任何线上评分/阈值/核验/展示逻辑，不发 Telegram，不写回 predictions.csv。
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rule-lab
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # safe_commit.sh 用它推送，不出现在命令行/日志
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Walk-forward + calibration facts
        run: python -m ah rule-lab --out data/rule_lab.json
      - name: Commit research facts (race-safe)
        run: |
          # 用仓库共用的安全提交脚本：文件锁 + pull --rebase + 竞争重试，
          # 避免多个定时任务同时 push 造成 non-fast-forward（首跑即因此失败）。
          scripts/safe_commit.sh --skip-tests \
            -m "MODEL CHANGE research: walk-forward and calibration facts (no live model change)" \
            data/rule_lab.json \
            || echo "::warning::研究事实提交失败，不影响本次运行结论（事实已在上方步骤生成）"
