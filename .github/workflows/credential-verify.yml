name: Credential swap verification (facts only)
# 换号后一键验证：runner 直连数据源，把事实提交回 main，从 contents 通道读回。
# 不发 Telegram、不触发日报、不写报告/台账、不改评分/阈值/核验口径。
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: credential-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      FIVEDOLLAR_KEY: ${{ secrets.FIVEDOLLAR_KEY }}
      GITHUB_AH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Verify swapped API-Football credential (facts only)
        continue-on-error: true
        run: python -m ah credential-verify --out data/credential_verify.json
      - name: Publish verification facts back to main
        if: always()
        run: |
          scripts/safe_commit.sh --skip-tests \
            -m "OPS: credential-verify facts (no key echoed, no report/ledger change)" \
            data/credential_verify.json \
            || echo "::warning::验证事实提交失败（不影响任何推送）"
